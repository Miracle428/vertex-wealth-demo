<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Vertex Wealth Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container">
    <div class="card">
      <h1>Vertex Wealth</h1>
      <p class="subtitle">Demo Trading Dashboard</p>

      <div class="notice">
        <strong>Demo account</strong><br>
        All balances and activity shown here are simulated and have no
        cash value.
      </div>

      <h2 id="welcome" style="margin-top: 25px;">Welcome</h2>

      <div class="card" style="margin-top: 20px;">
        <p><strong>Demo Balance</strong></p>
        <h2>$10,000.00</h2>
      </div>

      <div class="card" style="margin-top: 15px;">
        <p><strong>Portfolio</strong></p>
        <p>Stocks: $4,000.00</p>
        <p>Cash: $6,000.00</p>
      </div>

      <a class="button" href="#">View Demo Trades</a>

      <button class="button secondary" id="logout">
        Sign Out
      </button>
    </div>
  </main>

  <script>
    const loggedIn = localStorage.getItem("vertexDemoLoggedIn");
    const savedUser = JSON.parse(
      localStorage.getItem("vertexDemoUser")
    );

    if (loggedIn !== "true" || !savedUser) {
      window.location.href = "login.html";
    } else {
      document.getElementById("welcome").textContent =
        "Welcome, " + savedUser.name;
    }

    document.getElementById("logout").addEventListener("click", function() {
      localStorage.removeItem("vertexDemoLoggedIn");
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
